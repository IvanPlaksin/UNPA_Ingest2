# ═══════════════════════════════════════════════════════════════════
# UN ProjectAdvisor — CI/CD deploy compose (PULL-ONLY)
# ═══════════════════════════════════════════════════════════════════
# The artifact the CI pipeline deploys to the VM. Custom images are PULLED
# from GHCR (no build: sections). Standard images are pinned public images.
#   IMAGE_TAG=sha-<short> docker compose -f docker-compose.ci.yml pull && up -d
#
# Registry: ghcr.io/ivanplaksin/unpa_ingest2/<service>
# Excluded (out of scope): gnn, ollama, mssql.
# ═══════════════════════════════════════════════════════════════════

services:
  # ── STANDARD (pinned public images) ──────────────────────────────
  memgraph:
    image: memgraph/memgraph:latest
    container_name: projectadvisor-memgraph
    restart: unless-stopped
    ports: ["7687:7687", "7444:7444"]
    environment:
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-secret_password_123}
    command: ["--log-level=WARNING", "--memory-limit=1024", "--also-log-to-stderr"]
    volumes: ["memgraph_data:/var/lib/memgraph"]
    networks: [projectadvisor-network]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: projectadvisor-qdrant
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "bash", "-c", "printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' > /dev/tcp/localhost/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [projectadvisor-network]

  redis:
    image: redis:alpine
    container_name: projectadvisor-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --bind 0.0.0.0
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [projectadvisor-network]

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: projectadvisor-tei
    restart: unless-stopped
    ports: ["8081:80"]
    command: --model-id ${TEI_MODEL:-intfloat/multilingual-e5-large} --port 80
    volumes: ["tei_cache:/data"]
    networks: [projectadvisor-network]

  # ── CUSTOM (pulled from GHCR) ────────────────────────────────────
  gliner:
    image: ${GHCR:-ghcr.io/ivanplaksin/unpa_ingest2}/gliner:${IMAGE_TAG:-latest}
    container_name: projectadvisor-gliner
    restart: unless-stopped
    ports: ["5100:5100"]
    environment:
      - GLINER_MODEL=${GLINER_MODEL:-urchade/gliner_medium-v2.1}
      - PORT=5100
      - HF_HOME=/models
    volumes: ["gliner_models:/models"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    networks: [projectadvisor-network]

  api:
    image: ${GHCR:-ghcr.io/ivanplaksin/unpa_ingest2}/api:${IMAGE_TAG:-latest}
    container_name: projectadvisor-api
    restart: unless-stopped
    ports: ["3010:3000"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://memgraph:7687
      - NEO4J_USERNAME=memgraph
      - NEO4J_PASSWORD=${MEMGRAPH_PASSWORD:-secret_password_123}
      - QDRANT_URL=http://qdrant:6333
      - TEI_URL=http://tei:80
      - GLINER_URL=http://gliner:5100
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # ado.service.js throws at load if these are empty; api catches connect
      # failures at runtime, so non-empty placeholders let it boot (ADO disabled).
      - ADO_ORG_URL=${ADO_ORG_URL:-https://ado.invalid/placeholder}
      - ADO_PAT=${ADO_PAT:-placeholder}
    depends_on:
      redis: {condition: service_healthy}
      memgraph: {condition: service_started}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [projectadvisor-network]

  mcp:
    image: ${GHCR:-ghcr.io/ivanplaksin/unpa_ingest2}/mcp:${IMAGE_TAG:-latest}
    container_name: projectadvisor-mcp
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      - NGINX_API_URL=http://api:3000
    depends_on:
      api: {condition: service_started}
    networks: [projectadvisor-network]

  etl:
    image: ${GHCR:-ghcr.io/ivanplaksin/unpa_ingest2}/etl:${IMAGE_TAG:-latest}
    container_name: projectadvisor-etl
    restart: on-failure
    ports: ["3015:3000"]
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-secret_password_123}
      - QDRANT_URL=http://qdrant:6333
      - TEI_URL=http://tei:80
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ADO_ORG_URL=${ADO_ORG_URL:-}
      - ADO_PAT=${ADO_PAT:-}
    depends_on:
      redis: {condition: service_healthy}
      memgraph: {condition: service_started}
      qdrant: {condition: service_started}
      tei: {condition: service_started}
    volumes: ["etl_rawdata:/app/indexing-pipeline/raw_data"]
    # The worker exits immediately when ADO creds are absent; idle instead of
    # crash-looping so the container stays up (runs normally once creds are set).
    command: ["sh", "-c", "node src/run.js || { echo 'etl idle - ADO creds not set'; tail -f /dev/null; }"]
    networks: [projectadvisor-network]

  sync:
    image: ${GHCR:-ghcr.io/ivanplaksin/unpa_ingest2}/sync:${IMAGE_TAG:-latest}
    container_name: projectadvisor-sync
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=project_knowledge
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-secret_password_123}
      - TEI_URL=http://tei:80
      - REDIS_URL=redis://redis:6379
      - PROVIDERS_CONFIG=/app/config/providers.json
      - KNOWLEDGE_SOURCE_PATH=/app/knowledge
      - ARTIFACTS_PATH=/app/artifacts
      - CLAUDE_SESSION_KEY=${CLAUDE_SESSION_KEY:-}
      - CLAUDE_ORGANIZATION_ID=${CLAUDE_ORGANIZATION_ID:-}
      - CLAUDE_PROJECT_ID=${CLAUDE_PROJECT_ID:-}
      - SYNC_INTERVAL_MS=300000
      - LOG_LEVEL=info
    depends_on:
      redis: {condition: service_healthy}
      memgraph: {condition: service_started}
      qdrant: {condition: service_started}
      tei: {condition: service_started}
    volumes:
      - sync_knowledge:/app/knowledge
      - sync_artifacts:/app/artifacts
    networks: [projectadvisor-network]

volumes:
  memgraph_data:
  qdrant_data:
  redis_data:
  tei_cache:
  gliner_models:
  etl_rawdata:
  sync_knowledge:
  sync_artifacts:

networks:
  projectadvisor-network:
    name: projectadvisor-network
